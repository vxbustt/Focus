<!doctype html>

<html>
  <head>
    <meta charset="UTF-8" />
    <title>Focus</title>
  </head>

  <body>

    <div id="mainScreen">
      <h1>Focus, Productivity App</h1>
      <button id="OpenSettings">Settings</button>
      <hr>
      <input type="text" id="taskInput">
      <button id="AddTask"> + Add Task </button>
      <label id="Tasks" class="shh">  Tasks: 0
      </label>
      <label id="Completed" class="shh">  Completed: 0
      </label>

      <h2 for="taskslabel">  Tasks </h2>

      <div id="taskList"></div>
    </div>

    <div id="settingsScreen" hidden>
      <h1>Settings</h1>
      <input type="checkbox" id="allowdups">
      <label class="shh"> Allow Duplicate Tasks </label>
      
      <br>

      <button id="BackToMain" for="btm">Back to main</button>
    </div>

  </body>
</html>
